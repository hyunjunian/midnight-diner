<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111d20">
  <meta name="description" content="골목 끝, 당신의 작은 심야식당. 설치해서 즐기는 식당 운영 게임.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="심야식당">
  <title>심야식당</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="preload" as="image" href="./assets/visitors-a.webp">
  <link rel="preload" as="image" href="./assets/visitors-b.webp">
  <link rel="preload" as="image" href="./assets/intro-world.webp">
  <link rel="preload" as="image" href="./assets/decor-real.webp">
  <link rel="preload" as="image" href="./assets/food-clean.webp">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./kitchen.css">
  <link rel="stylesheet" href="./customer.css">
  <link rel="stylesheet" href="./motion.css">
  <link rel="stylesheet" href="./analog.css">
  <link rel="stylesheet" href="./frames.css">
  <link rel="stylesheet" href="./tactile-controls.css">
  <link rel="stylesheet" href="./physical-icons.css">
  <link rel="stylesheet" href="./polish.css">
  <script src="./catalog.js" defer></script>
  <script src="./stories.js" defer></script>
  <script src="./cooking-rules.js" defer></script>
  <script src="./furnishings.js" defer></script>
  <script src="./engine.js" defer></script>
  <script src="./morph.js" defer></script>
  <script src="./rain.js" defer></script>
  <script src="./scene.js" defer></script>
  <script src="./atmosphere.js" defer></script>
  <script src="./daylight.js" defer></script>
  <script src="./gestures.js" defer></script>
  <script src="./audio.js" defer></script>
  <script src="./voice.js" defer></script>
  <script src="./kitchen.js" defer></script>
  <script src="./game.js" defer></script>
  <script src="./pwa.js" defer></script>
</head>
<body>
  <section id="install-screen" class="install-screen" hidden aria-labelledby="install-title">
    <img class="install-backdrop" src="./assets/exterior.svg" alt="">
    <div class="install-content">
      <span class="app-seal">夜</span><p class="install-overline">골목 끝, 작은 불빛 하나</p>
      <h1 id="install-title">심야식당</h1><p class="install-description">당신의 밤이 시작되는 곳.</p>
      <button id="install-app" class="primary install-button">앱 설치하기 <span>↓</span></button>
      <p id="install-hint">홈 화면에 설치해서 전체 화면으로 즐겨 주세요.</p>
      <div id="install-guide" hidden></div>
      <p id="install-status" role="status"></p>
    </div>
  </section>

  <main id="app" class="game-app" hidden aria-label="심야식당 게임">
    <section class="restaurant" aria-label="식당과 손님">
      <div id="scene" class="scene">
        <div id="scene-world" class="world">
          <img class="interior-art" src="./assets/room-bare-v19.webp" alt="플레이어가 바 안쪽에서 손님을 마주 보는 심야식당">
          <img class="interior-closed" src="./assets/room-closed-v19.webp" alt="불을 켜기 전의 조용한 식당" aria-hidden="true"><div class="exterior-art"></div><canvas id="scene-rain" aria-hidden="true"></canvas><div id="decorations"></div><img class="counter-front" src="./assets/room-bare-v19.webp" alt="" aria-hidden="true">
          <div class="steam steam-one"></div><div class="steam steam-two"></div>
          <div id="customers" class="customers"></div>
        </div>
      </div>
      <div class="scene-controls"><button id="area-toggle">가게 밖 보기 ↗</button><span id="pan-hint">← 좌우로 밀어 가게를 둘러보세요 →</span><div class="pan-controls"><button id="pan-left" aria-label="가게 왼쪽 보기">‹</button><span id="pan-position">카운터</span><button id="pan-right" aria-label="가게 오른쪽 보기">›</button></div></div>
      <div id="placement-banner" class="placement-banner" role="status" hidden></div>
      <header class="game-hud">
        <div class="night-hud"><span class="hud-moon">☾</span><div><b id="day">1번째 밤</b><span id="open-status">영업 준비</span></div><span id="clock">23:50</span></div>
        <div class="wallet-hud"><div><span>자금</span><strong id="money">¥3,200</strong></div><div><span>평판</span><strong id="reputation">12</strong></div></div>
        <button id="settings-open" class="round-button" aria-label="설정 열기">⚙</button>
      </header>
      <div id="progress-hud" class="progress-hud"></div><button id="resume-kitchen" class="resume-kitchen" hidden>진행 중인 요리로 돌아가기 ↗</button>
      <section id="stock-prep" class="stock-prep" aria-label="영업 전 재료 준비" hidden></section>
      <div class="service-bar"><p id="service-hint"></p><button id="night-action" class="primary">식당 불 켜기 <span>↗</span></button></div>
      <nav class="game-dock" aria-label="식당 도구">
        <button data-tab="pantry" aria-label="냉장고 열기"><span>▤</span><b>냉장고</b></button>
        <button data-tab="menu" aria-label="메뉴 수첩 열기"><span>▧</span><b>메뉴 수첩</b></button>
        <button data-tab="shop" aria-label="가게 꾸미기 열기"><span>✧</span><b>가게 꾸미기</b></button>
        <button id="story-open" aria-label="손님 이야기 열기"><span>☷</span><b>이야기</b><i id="story-badge" hidden></i></button>
      </nav>
    </section>
    <section id="kitchen-screen" class="kitchen-screen" hidden aria-label="조리 부엌"><header class="kitchen-header"><button id="kitchen-back" aria-label="손님 테이블로 돌아가기">‹ 테이블</button><div><span id="kitchen-guest"></span><h2 id="kitchen-order"></h2></div><span id="kitchen-step-count"></span></header><div id="kitchen-content"></div><footer id="kitchen-footer"></footer></section>
  </main>

  <dialog id="guest-dialog" class="guest-dialog" aria-labelledby="talk-name">
    <div class="talk-card">
      <header class="talk-header"><span class="eyebrow">카운터에서 나누는 이야기</span><button type="button" data-close="guest-dialog" class="talk-close" aria-label="대화를 잠시 접고 자리로 돌아가기">잠시 자리로</button></header>
      <div id="talk-player-line" class="talk-player-line" hidden><strong class="talk-owner-label">주인장</strong><p id="talk-player-words"></p></div>
      <div class="talk-guest-message"><div id="talk-portrait" class="talk-portrait" aria-hidden="true"></div><div class="talk-guest-copy"><h2 id="talk-name"></h2><p id="talk-profile"></p><div class="talk-speech"><p id="talk-line" aria-live="polite"></p></div></div></div>
      <details class="talk-notes"><summary>손님 수첩</summary><dl id="talk-known-fields"></dl></details>
      <div id="talk-order" class="talk-order" hidden></div>
      <div id="talk-choices" class="talk-choices" aria-label="내가 할 말 고르기"></div>
      <button id="talk-gift" hidden></button><button id="talk-next" class="primary" hidden>주문 받고 부엌으로 →</button>
    </div>
  </dialog>
  <dialog id="report-dialog" class="sheet report" aria-labelledby="report-title"><header class="sheet-header"><div><span class="eyebrow">NIGHTLY REPORT</span><h2 id="report-title">오늘의 영업보고</h2></div><button data-close="report-dialog" class="round-button" aria-label="영업보고 닫기">×</button></header><div id="report-content" class="sheet-body"></div></dialog>
  <dialog id="management-dialog" class="sheet management" aria-labelledby="management-title">
    <header class="sheet-header"><div><span class="eyebrow">MY LITTLE DINER</span><h2 id="management-title">냉장고</h2></div><button data-close="management-dialog" class="round-button" aria-label="가게 관리 닫기">×</button></header>
    <div id="management-content" class="sheet-body"></div>
  </dialog>
  <dialog id="story-dialog" class="sheet story" aria-labelledby="story-title">
    <header class="sheet-header"><div><span id="story-tag" class="eyebrow">골목의 작은 일들</span><h2 id="story-title">카운터 너머의 이야기</h2></div><button data-close="story-dialog" class="round-button" aria-label="이야기 닫기">×</button></header>
    <div id="story-content" class="sheet-body"></div>
  </dialog>
  <dialog id="settings-dialog" class="sheet settings" aria-labelledby="settings-title">
    <header class="sheet-header"><h2 id="settings-title">잠시 쉬어 가기</h2><button data-close="settings-dialog" class="round-button" aria-label="설정 닫기">×</button></header>
    <div class="sheet-body settings-list">
      <button id="replay">인트로 다시 보기 <span>▶</span></button>
      <button id="sound-effects" aria-pressed="true">게임 소리 · 켜짐</button>
      <button id="fullscreen">전체 화면 <span>⛶</span></button>
      <button id="reset">처음부터 시작 <span>↺</span></button>
      <button id="update-app" hidden>새 버전으로 다시 열기 <span>↻</span></button>
      <p id="save-status"></p><p id="offline-status" role="status">오프라인 실행 준비 중…</p>
    </div>
  </dialog>
  <dialog id="reset-dialog" class="sheet confirm-dialog" aria-labelledby="reset-title">
    <div class="sheet-body"><h2 id="reset-title">첫날부터 다시 시작할까요?</h2><p>저장된 자금, 재료, 평판과 진행 상황이 초기화됩니다.</p><form method="dialog"><button value="cancel">돌아가기</button><button value="reset" class="primary">새로 시작</button></form></div>
  </dialog>

  <dialog id="intro" class="cinema" aria-label="심야식당 인트로 영상">
    <video id="opening-video" src="./assets/opening-visible-rain.mp4" poster="./assets/opening-portrait-poster.jpg" playsinline preload="auto" disablepictureinpicture aria-label="34초 세로형 시네마틱 인트로. 새로 제작한 실사풍 여성 주인장 장면, 한국어 자막, 일본어 여성 합성 내레이션과 직접 만든 음악·환경음이 포함되어 있습니다."></video>
    <div class="cinema-actions"><button id="sound-intro" aria-label="인트로 소리 켜기">소리 켜기 ♫</button><button id="skip-intro">건너뛰기 →</button></div>
    <button id="play-intro" class="cinema-play" hidden>터치해서 시작 <span>▶</span></button>
    <button id="pause-intro" class="cinema-pause" aria-label="인트로 일시정지">Ⅱ</button>
    <p id="video-status" role="status"></p>
    <div class="cinema-progress" aria-hidden="true"><span id="intro-progress"></span></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
